# Example workflow demonstrating how to use third-party CRS (Codex Relay Service) configuration
# 
# This example shows how to use a third-party relay service instead of direct OpenAI API access.
# The CRS relay service is useful when you want to:
# - Use an open-source relay service
# - Route requests through a custom endpoint
# - Use alternative authentication methods

name: Code review with CRS

on:
  pull_request:
    types: [opened]

jobs:
  codex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Explicitly check out the PR's merge commit.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base and head refs for the PR
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      # Run Codex with CRS configuration
      # Note: Store your CRS API key as a GitHub Actions secret named CRS_API_KEY
      - name: Run Codex with CRS
        id: run_codex
        uses: openai/codex-action@v1
        with:
          # Use CRS API key instead of OpenAI API key
          crs-api-key: ${{ secrets.CRS_API_KEY }}
          # Specify your CRS service base URL
          crs-base-url: "https://codex.letsfunapp.com/openai"
          # Optionally configure the model and reasoning effort
          crs-model: "gpt-5-codex"
          crs-reasoning-effort: "high"
          # Your prompt
          prompt: |
            This is PR #${{ github.event.pull_request.number }} for ${{ github.repository }}.
            Base SHA: ${{ github.event.pull_request.base.sha }}
            Head SHA: ${{ github.event.pull_request.head.sha }}

            Review ONLY the changes introduced by the PR.
            Suggest any improvements, potential bugs, or issues.
            Be concise and specific in your feedback.

            Pull request title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
